name: CD

on:
  workflow_call:

    inputs:

      # -------------------------------------------------------
      # Docker image SHA
      # -------------------------------------------------------
      image_tag:
        description: "Docker image SHA to deploy"
        required: true
        type: string

      # -------------------------------------------------------
      # GitHub environment
      # -------------------------------------------------------
      environment:
        description: "Deployment environment"
        required: true
        type: string

      # -------------------------------------------------------
      # Container name
      # -------------------------------------------------------
      container_name:
        description: "Docker container name"
        required: true
        type: string

      # -------------------------------------------------------
      # Application port
      # -------------------------------------------------------
      app_port:
        description: "Application port"
        required: true
        type: number


permissions:
  packages: read


jobs:

  # =========================================================
  # DEPLOY
  # =========================================================
  deploy:

    name: Deploy ${{ inputs.environment }}

    runs-on: self-hosted

    # -------------------------------------------------------
    # THIS activates GitHub Environment protection
    # -------------------------------------------------------
    environment:
      name: ${{ inputs.environment }}

    steps:

      # =======================================================
      # 1. Login to GHCR
      # =======================================================
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # =======================================================
      # 2. Pull exact image
      # =======================================================
      - name: Pull Docker image
        shell: bash
        run: |

          IMAGE="ghcr.io/ahmedmaherhosny/devops-cicd-lab:${{ inputs.image_tag }}"

          echo "Pulling:"
          echo "$IMAGE"

          docker pull "$IMAGE"


      # =======================================================
      # 3. Save currently running image
      # =======================================================
      - name: Get current image
        id: current
        shell: bash
        run: |

          CURRENT_IMAGE=$(docker inspect \
            --format='{{.Config.Image}}' \
            "${{ inputs.container_name }}" \
            2>/dev/null || true)

          echo "Current image:"
          echo "$CURRENT_IMAGE"

          echo "current_image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"


      # =======================================================
      # 4. Stop old container
      # =======================================================
      - name: Stop old container
        shell: bash
        run: |

          docker stop \
            "${{ inputs.container_name }}" \
            2>/dev/null || true


      # =======================================================
      # 5. Remove old container
      # =======================================================
      - name: Remove old container
        shell: bash
        run: |

          docker rm \
            "${{ inputs.container_name }}" \
            2>/dev/null || true


      # =======================================================
      # 6. Start new container
      # =======================================================
      - name: Start new container
        shell: bash
        run: |

          IMAGE="ghcr.io/ahmedmaherhosny/devops-cicd-lab:${{ inputs.image_tag }}"

          echo "Starting:"
          echo "$IMAGE"

          docker run -d \
            --name "${{ inputs.container_name }}" \
            -p "${{ inputs.app_port }}:8080" \
            "$IMAGE"


      # =======================================================
      # 7. Health check
      # =======================================================
      - name: Health check
        shell: bash
        run: |

          echo "Waiting for application..."

          for i in {1..30}; do

            echo "Health check attempt $i/30"

            if curl -fsS \
              "http://localhost:${{ inputs.app_port }}/health"; then

              echo ""
              echo "======================================"
              echo "HEALTH CHECK PASSED"
              echo "======================================"

              exit 0

            fi

            sleep 2

          done

          echo ""
          echo "======================================"
          echo "HEALTH CHECK FAILED"
          echo "======================================"

          exit 1


      # =======================================================
      # 8. Show container status
      # =======================================================
      - name: Show container status
        if: always()
        shell: bash
        run: |

          docker ps -a


      # =======================================================
      # 9. Show application logs
      # =======================================================
      - name: Show application logs
        if: always()
        shell: bash
        run: |

          docker logs \
            "${{ inputs.container_name }}" \
            2>&1 || true


      # =======================================================
      # 10. Rollback
      # =======================================================
      - name: Rollback
        if: failure()
        shell: bash
        run: |

          echo "======================================"
          echo "DEPLOYMENT FAILED"
          echo "STARTING ROLLBACK"
          echo "======================================"

          CURRENT_IMAGE="${{ steps.current.outputs.current_image }}"

          echo "Previous image:"
          echo "$CURRENT_IMAGE"


          # ---------------------------------------------------
          # Stop failed container
          # ---------------------------------------------------

          docker stop \
            "${{ inputs.container_name }}" \
            2>/dev/null || true


          # ---------------------------------------------------
          # Remove failed container
          # ---------------------------------------------------

          docker rm \
            "${{ inputs.container_name }}" \
            2>/dev/null || true


          # ---------------------------------------------------
          # Check previous image
          # ---------------------------------------------------

          if [ -z "$CURRENT_IMAGE" ]; then

            echo "No previous image found."
            echo "Nothing to rollback to."

            exit 1

          fi


          # ---------------------------------------------------
          # Start previous version
          # ---------------------------------------------------

          echo "Starting previous version..."

          docker run -d \
            --name "${{ inputs.container_name }}" \
            -p "${{ inputs.app_port }}:8080" \
            "$CURRENT_IMAGE"


          # ---------------------------------------------------
          # Rollback health check
          # ---------------------------------------------------

          echo "Checking rollback health..."

          for i in {1..30}; do

            echo "Rollback health check attempt $i/30"

            if curl -fsS \
              "http://localhost:${{ inputs.app_port }}/health"; then

              echo ""
              echo "======================================"
              echo "ROLLBACK SUCCESSFUL"
              echo "======================================"

              exit 0

            fi

            sleep 2

          done


          echo ""
          echo "======================================"
          echo "ROLLBACK FAILED"
          echo "======================================"

          exit 1


      # =======================================================
      # 11. Deployment successful
      # =======================================================
      - name: Deployment successful
        if: success()
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          echo "Environment:"
          echo "${{ inputs.environment }}"

          echo ""
          echo "Image:"
          echo "ghcr.io/ahmedmaherhosny/devops-cicd-lab:${{ inputs.image_tag }}"

          echo ""
          echo "Container:"
          echo "${{ inputs.container_name }}"

          echo ""
          echo "Port:"
          echo "${{ inputs.app_port }}"

          echo ""
          echo "Health:"
          echo "http://localhost:${{ inputs.app_port }}/health"

          echo "======================================"