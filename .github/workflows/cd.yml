name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image SHA to deploy"
        required: true
        type: string

permissions:
  packages: read

env:
  IMAGE_NAME: ghcr.io/ahmedmaherhosny/devops-cicd-lab
  CONTAINER_NAME: myapp
  APP_PORT: 8080

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # =========================================================
      # 1. Login to GitHub Container Registry
      # =========================================================
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # =========================================================
      # 2. Pull the exact image we want to deploy
      # =========================================================
      - name: Pull Docker image
        shell: bash
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}


      # =========================================================
      # 3. Find currently running container
      # =========================================================
      - name: Get current image
        id: current
        shell: bash
        run: |

          CURRENT_IMAGE=$(docker inspect \
            --format='{{.Config.Image}}' \
            ${{ env.CONTAINER_NAME }} 2>/dev/null || true)

          echo "Current image: $CURRENT_IMAGE"

          echo "current_image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 4. Stop current container
      # =========================================================
      - name: Stop old container
        shell: bash
        run: |
          docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true


      # =========================================================
      # 5. Remove current container
      # =========================================================
      - name: Remove old container
        shell: bash
        run: |
          docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true


      # =========================================================
      # 6. Start new container
      # =========================================================
      - name: Start new container
        shell: bash
        run: |

          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}


      # =========================================================
      # 7. Health check
      # =========================================================
      - name: Health check
        id: health
        shell: bash
        run: |

          echo "Waiting for application to start..."

          for i in {1..30}; do

            echo "Health check attempt $i/30"

            if curl -fsS \
              http://localhost:${{ env.APP_PORT }}/health; then

              echo ""
              echo "======================================"
              echo "Health check PASSED"
              echo "======================================"

              exit 0
            fi

            sleep 2

          done

          echo ""
          echo "======================================"
          echo "Health check FAILED"
          echo "======================================"

          exit 1


      # =========================================================
      # 8. Show container information
      # =========================================================
      - name: Show container status
        if: always()
        shell: bash
        run: |
          docker ps -a


      # =========================================================
      # 9. Show application logs
      # =========================================================
      - name: Show application logs
        if: always()
        shell: bash
        run: |
          docker logs ${{ env.CONTAINER_NAME }} 2>&1 || true


      # =========================================================
      # 10. Rollback if deployment failed
      # =========================================================
      - name: Rollback
        if: failure()
        shell: bash
        run: |

          echo "======================================"
          echo "DEPLOYMENT FAILED"
          echo "Starting rollback..."
          echo "======================================"

          CURRENT_IMAGE="${{ steps.current.outputs.current_image }}"

          echo "Previous image:"
          echo "$CURRENT_IMAGE"


          # -----------------------------------
          # Stop failed deployment
          # -----------------------------------

          docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true

          docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true


          # -----------------------------------
          # Check whether previous image exists
          # -----------------------------------

          if [ -z "$CURRENT_IMAGE" ]; then

            echo "No previous container/image found."
            echo "Nothing to rollback to."

            exit 1

          fi


          # -----------------------------------
          # Start previous version
          # -----------------------------------

          echo "Starting previous version..."

          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            "$CURRENT_IMAGE"


          # -----------------------------------
          # Verify rollback
          # -----------------------------------

          echo "Checking rollback health..."

          for i in {1..30}; do

            echo "Rollback health check attempt $i/30"

            if curl -fsS \
              http://localhost:${{ env.APP_PORT }}/health; then

              echo ""
              echo "======================================"
              echo "ROLLBACK SUCCESSFUL"
              echo "======================================"

              exit 0
            fi

            sleep 2

          done


          echo ""
          echo "======================================"
          echo "ROLLBACK FAILED"
          echo "======================================"

          exit 1


      # =========================================================
      # 11. Deployment successful
      # =========================================================
      - name: Deployment successful
        if: success()
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          echo "Image:"
          echo "${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"

          echo ""
          echo "Application:"
          echo "http://localhost:${{ env.APP_PORT }}"

          echo ""
          echo "Health:"
          echo "http://localhost:${{ env.APP_PORT }}/health"

          echo "======================================"